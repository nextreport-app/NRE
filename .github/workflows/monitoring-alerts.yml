name: Monitoring alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: production-monitoring-alerts
  cancel-in-progress: false

jobs:
  check:
    if: vars.NEXTREPORT_MONITORING_RUNNER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check monitored accounts and retry alert emails
        env:
          MONITORING_CRON_SECRET: ${{ secrets.MONITORING_CRON_SECRET }}
        run: node scripts/run-monitoring-alerts.mjs
