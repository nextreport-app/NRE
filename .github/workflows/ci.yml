name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  objective-regression:
    name: Objective regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run objective regression gate
        run: npm run test:objective-regression

      - name: Check source accounting and rendered deck cells
        run: npm run test:reporting-accuracy

  api-routes:
    name: API route integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API route integration tests
        run: npm run test:api-routes

  launch-safety:
    name: Billing and launch safety
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nre
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nre_launch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nre -d nre_launch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nre:local_ci_only@127.0.0.1:5432/nre_launch_test
      DIRECT_URL: postgresql://nre:local_ci_only@127.0.0.1:5432/nre_launch_test
      LAUNCH_TEST_DATABASE_URL: postgresql://nre:local_ci_only@127.0.0.1:5432/nre_launch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:launch-safety
      - run: npm run test:lifecycle
